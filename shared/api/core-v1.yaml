openapi: 3.1.1
info:
  title: EUDORIA Core — Public API
  version: 1.3.0
  description: |
    Public API of the EUDORIA core (clients). Contract-first: this file is written
    before the code and the core is tested against it (ADR-0001).
    Every path below is relative to the server URL, which carries the major version (/v1).
servers:
  - url: http://localhost:5080/v1
    description: Local development only (HTTPS is mandatory everywhere else).
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: accounts
    description: EUDORIA identities (accounts).
  - name: auth
    description: |
      Sessions: login, token renewal, logout. The access token is a JWT signed with ES256,
      valid 15 minutes, audience "eudoria-core": it is accepted by the core API only (world
      servers will get their own short-lived entry tickets, sub-step 1.6). The refresh token is
      an opaque random value, stored server-side (hashed) and revocable; it is rotated on every use.

      Limits (sub-step 1.4): failed logins are counted per e-mail and client address, and per
      e-mail alone; past the limit, attempts are refused for a while (429 with Retry-After), even
      with the right password. Each authentication route also has a request rate limit per client
      address (IPv4 address, or IPv6 /64 prefix). The values are server settings, not part of the contract.
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness probe — the core process is running.
      description: Never touches the database or any other dependency.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness probe — the core can serve requests (database reachable).
      description: |
        Returns 503 when a required dependency is unavailable. The response never
        contains internal details (error messages, host names).
      responses:
        '200':
          description: The core is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: unavailable
  /accounts:
    post:
      tags: [accounts]
      operationId: registerAccount
      summary: Registers a new EUDORIA account.
      description: |
        Creates an account from an e-mail, a unique public pseudo and a password.

        To avoid revealing whether an e-mail address already has an account, an e-mail that
        is already in use gets exactly the same 202 response as a successful registration
        (same body, comparable duration); no second account is created. The pseudo is public,
        so a taken pseudo is reported (409).

        Server-side rules (all errors are returned together):
        - email: surrounding whitespace removed, lower-cased; at most 254 characters; one '@'
          with a non-empty local part and a domain containing a dot; no whitespace or control character.
        - pseudo: 3 to 20 characters among A-Z, a-z, 0-9, '_' and '-', starting with a letter;
          unique regardless of letter case.
        - password: normalized to Unicode NFKC first, then 12 to 128 characters (Unicode code points);
          every character is allowed, no composition rule. Refused (password_too_common) when it is a
          commonly used password (list of leaked passwords, letter case ignored), or when it contains
          the pseudo, the part of the e-mail before '@', or "eudoria" (for words of 4 characters or more).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
            example:
              email: ana@example.com
              pseudo: Ana_42
              password: a-long-enough-passphrase
      responses:
        '202':
          description: |
            Registration accepted: the account was created, or the e-mail was already in use
            (indistinguishable on purpose).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
              example:
                status: accepted
        '400':
          description: The request body or one of its fields is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                errors:
                  - field: pseudo
                    code: pseudo_too_short
                  - field: password
                    code: password_too_short
        '409':
          description: The pseudo is already taken (letter case ignored).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                errors:
                  - field: pseudo
                    code: pseudo_taken
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServerBusy'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Logs in with an e-mail and a password, and opens a session.
      description: |
        The e-mail is normalized as at registration (trimmed, lower-cased) and the password is
        normalized to Unicode NFKC. An unknown e-mail and a wrong password get exactly the same
        401 response (comparable duration), so this route does not reveal whether an e-mail has
        an account. Failed attempts are limited (see the "auth" tag): a blocked attempt gets 429
        without the password being checked, and the same 429 whether the e-mail has an account or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana@example.com
              password: a-long-enough-passphrase
      responses:
        '200':
          description: Logged in. A new session (refresh token family) is opened.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The request body is unreadable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                errors:
                  - field: body
                    code: body_invalid
        '401':
          description: Unknown e-mail or wrong password (indistinguishable on purpose).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                errors:
                  - field: credentials
                    code: invalid_credentials
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServerBusy'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchanges a refresh token for a new token pair (rotation).
      description: |
        The refresh token sent is consumed and can never be used again. Presenting an already
        consumed refresh token is treated as theft: the whole session is revoked.
        A refresh token is valid 7 days after it was issued, and a session at most 30 days after login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: New token pair, in the same session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The request body is unreadable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unknown, expired, revoked or already used refresh token (indistinguishable).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                errors:
                  - field: refreshToken
                    code: refresh_token_invalid
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Closes the session of a refresh token.
      description: |
        Revokes the session (refresh token family) the token belongs to. Always answers 204,
        even for an unknown or already revoked token. Access tokens already issued stay valid
        until they expire (at most 15 minutes); clients simply forget them. To cut every session
        and every access token at once, use /me/sessions/revoke-all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '204':
          description: Logged out (or nothing to do).
        '400':
          description: The request body is unreadable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me:
    get:
      tags: [accounts]
      operationId: getMyProfile
      summary: Returns the profile of the account the access token belongs to.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's own profile (the e-mail is not returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 0193f5a2-7c1e-7b3a-9d4e-2f6a8b0c1d2e
                pseudo: Ana_42
                createdAt: '2026-11-24T19:30:00+00:00'
        '401':
          description: |
            Missing, expired, malformed or forged access token, or a token meant for another
            audience, or a token issued before a password change or a "revoke-all". No body; the
            WWW-Authenticate header says "Bearer".
          headers:
            WWW-Authenticate:
              schema:
                type: string
  /me/password:
    post:
      tags: [accounts]
      operationId: changeMyPassword
      summary: Changes the caller's password and signs out every other device.
      description: |
        Requires the current password. The new password follows the registration rules
        (NFKC, 12 to 128 code points, not a common password, not containing the pseudo, the
        part of the e-mail before '@' or "eudoria") and must differ from the current one.

        On success, every session of the account is revoked and every access token issued before
        is refused from now on; a new session is opened for the caller, whose tokens are returned.
        Wrong current passwords are limited like logins (per account and client address).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: a-long-enough-passphrase
              newPassword: another-long-passphrase-2026
      responses:
        '200':
          description: Password changed; tokens of the new session (the only one left).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The body is unreadable, or the new password is refused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                errors:
                  - field: newPassword
                    code: password_too_common
        '401':
          description: |
            Wrong current password (invalid_credentials on currentPassword). A missing, expired,
            forged or revoked access token also gets 401, without a body (WWW-Authenticate: Bearer).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                errors:
                  - field: currentPassword
                    code: invalid_credentials
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServerBusy'
  /me/sessions/revoke-all:
    post:
      tags: [accounts]
      operationId: revokeAllMySessions
      summary: Signs out every device, this one included.
      description: |
        Revokes every session (refresh token) of the account, and every access token issued so
        far is refused from now on, this one included. No password is asked: the worst case is
        having to log in again.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Every device is signed out.
        '401':
          description: |
            Missing, expired, malformed, forged or revoked access token. No body; the
            WWW-Authenticate header says "Bearer".
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login or /auth/refresh (ES256, audience "eudoria-core").
  headers:
    NoStore:
      description: Token responses must never be cached (RFC 6749).
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Number of seconds to wait before trying again (RFC 9110).
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    TooManyRequests:
      description: |
        Too many attempts or requests: try again after the number of seconds given by Retry-After.
        Same answer whether the e-mail (or account) exists or not.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            errors:
              - field: request
                code: too_many_attempts
    ServerBusy:
      description: |
        The core is momentarily too busy checking passwords (protection against overload):
        try again after the number of seconds given by Retry-After.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            errors:
              - field: request
                code: server_busy
  schemas:
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [email, pseudo, password]
      properties:
        email:
          type: string
          maxLength: 254
        pseudo:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z][A-Za-z0-9_-]{2,19}$'
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFKC normalization.
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFKC normalization.
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
          description: JWT (ES256). Claims sub (account UUID), iss, aud ("eudoria-core"), iat, exp, jti.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Lifetime of the access token, in seconds.
        refreshToken:
          type: string
          description: 32 random bytes, Base64 URL-safe without padding.
          pattern: '^[A-Za-z0-9_-]{43}$'
        refreshExpiresIn:
          type: integer
          description: Lifetime of this refresh token, in seconds (never beyond the end of the session).
    Profile:
      type: object
      additionalProperties: false
      required: [id, pseudo, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable internal identifier of the account (same value as the token's "sub").
        pseudo:
          type: string
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details, with one machine-readable code per error.
      additionalProperties: false
      required: [type, title, status, errors]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          enum: [body, request, email, pseudo, password, credentials, refreshToken, currentPassword, newPassword]
          description: |
            'body' when the request as a whole is unreadable (not JSON, unknown or duplicate property,
            wrong type, too large); 'request' for the limits (too_many_attempts, server_busy).
        code:
          type: string
          enum:
            - body_invalid
            - email_required
            - email_invalid
            - pseudo_required
            - pseudo_too_short
            - pseudo_too_long
            - pseudo_invalid_characters
            - pseudo_must_start_with_letter
            - pseudo_taken
            - password_required
            - password_too_short
            - password_too_long
            - password_too_common
            - password_unchanged
            - invalid_credentials
            - refresh_token_invalid
            - too_many_attempts
            - server_busy
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
